# GoReleaser configuration for KubeWhy.
#
# Nothing is published without an explicit tag and the credentials the release
# workflow provides. `goreleaser build --snapshot --clean` builds locally
# without touching anything.
version: 2

project_name: kubewhy

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: kubectl-why
    main: ./cmd/kubectl-why
    binary: kubectl-why
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/xavimf87/kubewhy/internal/version.Version={{ .Version }}
      - -X github.com/xavimf87/kubewhy/internal/version.Commit={{ .FullCommit }}
      - -X github.com/xavimf87/kubewhy/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: kubectl-why
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: New diagnoses
      regexp: '(?i)^.*\b(rule|diagnos)'
      order: 0
    - title: Features
      regexp: '(?i)^feat'
      order: 1
    - title: Fixes
      regexp: '(?i)^fix'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '(?i)^docs?:'
      - '(?i)^test:'
      - '(?i)^chore'
      - Merge pull request

release:
  draft: true
  prerelease: auto
  footer: |
    ## Install

    ```bash
    go install github.com/xavimf87/kubewhy/cmd/kubectl-why@{{ .Tag }}
    ```

    Or download the archive for your platform below, extract `kubectl-why`,
    and place it anywhere on your `PATH`. kubectl then exposes it as
    `kubectl why`.

    Verify the download against `checksums.txt`.
