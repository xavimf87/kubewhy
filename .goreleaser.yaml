# GoReleaser configuration for KubeWhy.
#
# Nothing is published without an explicit tag and the credentials the release
# workflow provides. `goreleaser build --snapshot --clean` builds locally
# without touching anything.
version: 2

project_name: kubewhy

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: kubectl-why
    main: ./cmd/kubectl-why
    binary: kubectl-why
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # .Tag rather than .Version: the latter strips the leading v, and the
      # tag, the release and `go install ...@v0.1.1` all keep it.
      - -X github.com/xavimf87/kubewhy/internal/version.Version={{ .Tag }}
      - -X github.com/xavimf87/kubewhy/internal/version.Commit={{ .FullCommit }}
      - -X github.com/xavimf87/kubewhy/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: kubectl-why
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The tag rather than the bare version, so an archive name can be derived
    # from {{ .TagName }} alone. That is all the Krew release bot's template
    # language offers, and it is what keeps the Krew manifest generated rather
    # than hand-written.
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

# A Homebrew cask rather than a formula: `brews` is deprecated, and casks now
# work on Linuxbrew too. Installing through brew also answers the Gatekeeper
# dialog that catches people who download the archive in a browser — brew
# fetches with curl, and the hook below strips the quarantine attribute that
# macOS would otherwise refuse to run.
homebrew_casks:
  - name: kubewhy
    repository:
      owner: xavimf87
      name: homebrew-tap
      branch: main
      # A token of its own, because GITHUB_TOKEN cannot write to another
      # repository. Set HOMEBREW_TAP_TOKEN in this repository's secrets.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/xavimf87/kubewhy
    description: A read-only kubectl plugin that explains why Kubernetes resources aren't working
    license: Apache-2.0
    binaries:
      - kubectl-why
    # Until the token exists, publish nothing rather than fail a release whose
    # binaries have already shipped. The release workflow always defines the
    # variable, empty or not, because GoReleaser has no way to default one that
    # is absent entirely.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}false{{ end }}'
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kubectl-why"]
          end
    caveats: |
      kubectl exposes any executable named kubectl-* on your PATH, so this
      installs as:

        kubectl why pod api-7b89d8c9-xfd2

      Run 'kubectl why rules' for every diagnosis it can produce.

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release notes are the changelog. There is no CHANGELOG.md to drift from
# them, and the commit titles are Conventional Commits, so the grouping below
# is derived from what actually landed rather than maintained by hand.
changelog:
  use: git
  sort: asc
  groups:
    - title: New diagnoses and features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^(fix|revert)(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^refactor(\(.+\))?:'
      - '^Merge '

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    go install github.com/xavimf87/kubewhy/cmd/kubectl-why@{{ .Tag }}
    ```

    Or download the archive for your platform below, extract `kubectl-why`,
    and place it anywhere on your `PATH`. kubectl then exposes it as
    `kubectl why`.

    Verify the download against `checksums.txt`.
