<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="KubeWhy — stop describing Kubernetes problems, start explaining them">
  <title>KubeWhy</title>
  <defs>
    <linearGradient id="kw-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A8BF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="kw-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#9FB3C8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0D1117"/>

  <!-- The mark, scaled from logo.svg. -->
  <g transform="translate(452 78) scale(1.4)">
    <polygon
      points="128.0,28.0 206.2,65.7 225.5,150.3 171.4,218.1 84.6,218.1 30.5,150.3 49.8,65.7"
