    <circle cx="128" cy="186" r="11" fill="#F59E0B"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="486" font-size="82" font-weight="700" fill="url(#kw-word)" letter-spacing="-1">KubeWhy</text>
    <text x="640" y="534" font-size="27" font-weight="500" fill="#7D8590">Stop describing Kubernetes problems. Start explaining them.</text>
    <text x="640" y="580" font-size="22" font-weight="400" fill="#4A8BF5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">kubectl why pod api-7b89d8c9-xfd2</text>
  </g>
