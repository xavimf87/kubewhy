name: E2E

# End-to-end scenarios need a real cluster, so they do not gate every pull
# request. They gate every release instead: the main pipeline calls this one and
# will not tag anything until it passes. The scheduled pipeline calls it weekly
# too, to catch Kubernetes changing its behaviour under us while nothing here
# changed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    name: Scenarios on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the plugin
        run: make build

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubewhy-e2e

      - name: Run the scenarios
        env:
          KUBEWHY_E2E_YES: "1"
        run: test/e2e/run.sh
