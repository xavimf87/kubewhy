name: Verify

# Everything that decides whether the code is good, in one reusable place.
#
# Both the pull request pipeline and the main pipeline call this, so a change
# can never be verified one way before merging and another way after.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted; run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: |
          for script in hack/*.sh test/e2e/*.sh; do
            bash -n "$script" && echo "ok $script"
          done

      # Every release the project cuts goes through next-version.sh, so its
      # arithmetic is tested like any other code.
      - name: Version calculation
        run: hack/next-version.test.sh

  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Build a snapshot for every target platform
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot --clean
