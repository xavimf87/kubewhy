name: CodeQL

# KubeWhy runs with a user's cluster credentials, so a vulnerability here is a
# vulnerability in their cluster access. Called by the pull request and main
# pipelines, and weekly on its own, because a dependency can turn a safe
# pattern unsafe without the code changing at all.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse
    # Code scanning is free on public repositories and needs GitHub Advanced
    # Security on private ones. Running the analysis only to fail at the upload
    # would put a permanent red cross on every push and teach people to ignore
    # it, so it waits until it can report somewhere.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
