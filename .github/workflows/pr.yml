name: PR

# One workflow runs on a pull request, and it checks exactly what the main
# pipeline checks after the merge: the same reusable Verify workflow and the
# same end-to-end scenarios. A green pull request cannot turn red on main,
# which matters here because merging to main releases.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9,./-]+\))?!?: .+'

          if ! [[ "$TITLE" =~ $pattern ]]; then
            cat >&2 <<MSG
          The pull request title does not follow Conventional Commits.

            got:  $TITLE
            want: <type>[optional scope]: <description>

          Pull requests are squash-merged, so this title becomes the commit on
          main, and main releases everything that reaches it. The type decides
          the version:

            feat      a new rule, resource or user-visible capability   minor bump
            fix       a wrong or misleading diagnosis, or a bug         patch bump
            perf      fewer API calls, faster analysis                  patch bump
            docs      documentation only                                no release
            refactor  internal change with no behaviour change          no release
            test      tests only                                        no release
            build     build, packaging or dependencies                  no release
            ci        workflows                                         no release
            chore     anything else                                     no release

          Add ! before the colon for a breaking change to the CLI syntax, a rule
          identifier, a JSON field or an exit code: "feat!: rename ...".

          Examples:

            feat: add POD_FAILED_MOUNT rule
            feat(service): follow EndpointSlices to the backend Pods
            fix: stop reporting expired probe failures as current
            docs(rules): explain why numeric target ports are not checked
          MSG
            exit 1
          fi

          subject="${TITLE#*: }"
          if [[ "$subject" == *. ]]; then
            echo "The title should not end with a full stop: $TITLE" >&2
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "The title is ${#TITLE} characters; keep it under 72 so it reads well in git log." >&2
            exit 1
          fi
          echo "ok: $TITLE"

  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  # The end-to-end scenarios gate the release, so they have to gate the merge
  # too. Without this a pull request could pass everything, merge, and then
  # fail on main — where "main is always releasable" stops being true and it
  # takes another commit to make it true again.
  #
  # It runs beside Verify rather than after it. The scenarios build the binary
  # themselves, so a change that does not compile fails here in a minute
  # instead of waiting seven for the cross-platform build to finish first.
  e2e:
    name: End to end
    uses: ./.github/workflows/e2e.yml

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      actions: read
      contents: read
