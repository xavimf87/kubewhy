name: Main

# One workflow runs on main. Everything a merge triggers is a job inside it,
# so there is a single place to look and a single verdict.
#
#   verify ────────┐
#   (tests, lint,  │
#    build, e2e)   ├──▶ release
#   plan ──────────┘
#
# The release is downstream of verification, not beside it. Nothing is tagged
# or published unless the tests, the linters, the cross-platform build and the
# end-to-end scenarios have all passed on this exact commit.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a version, e.g. v0.2.0. Leave empty to derive it from the commits.'
        required: false
        type: string

permissions:
  contents: read

# Releases are serialised. Two merges landing together must not race to tag.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  # What the commits since the last release are worth. Seconds, and it decides
  # whether the expensive parts below are worth running at all.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history and every tag, to compare against

      - name: Work out the next version
        id: plan
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            echo "forced: $version"
          else
            version="$(hack/next-version.sh --explain)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ -z "$version" ]]; then
            echo "Nothing releasable landed, so nothing is released." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "These commits are worth **$version**." >> "$GITHUB_STEP_SUMMARY"
          fi

  # A release has to work against a real cluster, not merely compile. This is
  # the slow part, so it only runs when there is something to release.
  e2e:
    name: End to end
    needs: [verify, plan]
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/e2e.yml

  # Static analysis reports to the security tab rather than gating a build, so
  # it runs alongside rather than in front of the release.
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      actions: read
      contents: read

  release:
    name: Release
    needs: [plan, verify, e2e]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The tag has to exist before the build, because it is what GoReleaser
      # derives the version from.
      - name: Tag ${{ needs.plan.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Build and publish
        id: publish
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot write to another repository, so pushing the
          # Homebrew formula to the tap needs its own. It is empty until the
          # secret exists, which GoReleaser is configured to treat as "skip", so
          # a release never fails over a formula it could not publish.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A tag left behind by a build that failed would name a release nobody
      # can install, and the next run would read it as the last release and
      # skip the version entirely. Take it back.
      - name: Untag a release that never shipped
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          git push --delete origin "$VERSION" || true
          echo "Publishing failed, so $VERSION was untagged. The next run will try it again." >> "$GITHUB_STEP_SUMMARY"

      # Once the plugin is in the Krew index, this opens the pull request that
      # updates it, so a release does not need a hand-written manifest every
      # time. It fails until the plugin is accepted, which must not fail the
      # release that was already published.
      - name: Offer the new version to the Krew index
        continue-on-error: true
        uses: rajatjindal/krew-release-bot@v0.0.51

      - name: Summarise
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo '```bash'
            echo "go install github.com/xavimf87/kubewhy/cmd/kubectl-why@$VERSION"
            echo '```'
            echo
            echo "Binaries and checksums are attached to the release."
          } >> "$GITHUB_STEP_SUMMARY"
