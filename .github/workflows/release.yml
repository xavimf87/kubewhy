name: Release

# Trunk-based development: main is always releasable, and everything that
# reaches main is released.
#
# There is no release branch, no release pull request and no version to type.
# A pull request is squash-merged with a Conventional Commits title, that title
# decides the version, and the release goes out minutes later.
#
#   merge to main ──▶ what version do these commits deserve?
#                     │
#                     ├── nothing releasable (docs, chore) ──▶ stop
#                     │
#                     └── verify against a real cluster ──▶ tag ──▶ publish
#
# The tag is created inside this run rather than by a person, and the build
# follows it in the same run: a tag pushed with GITHUB_TOKEN does not start
# another workflow, so a separate tag-triggered job would never fire.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a version, e.g. v0.2.0. Leave empty to derive it from the commits.'
        required: false
        type: string

permissions:
  contents: read

# Releases are serialised. Two merges landing together must not race to tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history and every tag, to compare against

      - name: Work out the next version
        id: plan
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            echo "forced: $version"
          else
            version="$(hack/next-version.sh --explain)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ -z "$version" ]]; then
            echo "Nothing releasable landed. No release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next release: **$version**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A release is only worth cutting if it works against a real cluster, so the
  # end-to-end scenarios gate it rather than merely reporting afterwards.
  verify:
    name: Verify
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/e2e.yml

  release:
    name: Release
    needs: [plan, verify]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tag ${{ needs.plan.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Build and publish
        id: publish
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag has to exist before the build, because it is what the version
      # is derived from. If the build then fails, that tag is a lie: it names a
      # release nobody can install, and the next run would read it as the last
      # release and skip the version entirely. Take it back.
      - name: Untag a release that never shipped
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          git push --delete origin "$VERSION" || true
          echo "Publishing failed, so $VERSION was untagged. The next run will try it again." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo '```bash'
            echo "go install github.com/xavimf87/kubewhy/cmd/kubectl-why@$VERSION"
            echo '```'
            echo
            echo "Binaries and checksums are attached to the release."
          } >> "$GITHUB_STEP_SUMMARY"
