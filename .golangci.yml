# Linters KubeWhy runs. The set is deliberately small: correctness and real
# bugs, not style arguments. gofmt and go vet already cover formatting and the
# common mistakes.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - govet         # what `go vet` reports
    - ineffassign   # assignments that are never used
    - staticcheck   # correctness and simplification
    - unused        # dead code
    # No locale is set for misspell on purpose. Enforcing British spelling
    # flags Color, NO_COLOR and "normalized" — a Go field, an environment
    # variable defined by no-color.org, and the word the Kubernetes API itself
    # uses. The prose here is British by hand; the code spells things the way
    # its own standards do.
    - misspell      # typos in comments and strings
    - bodyclose     # leaked HTTP response bodies

  settings:
    errcheck:
      # A command-line tool that cannot write to its own stdout has nothing
      # useful to do about it. Everywhere the error can be acted on — the text
      # renderer — it is tracked and returned.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        - -ST1000   # package comment style is enforced by review, not a linter

  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately ignore errors that a test would otherwise
      # report twice.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
