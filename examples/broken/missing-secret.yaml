# Reads an environment variable from a Secret that was never created.
# Expected: POD_MISSING_SECRET. KubeWhy checks only that the Secret exists,
# using a metadata-only request; it never reads Secret contents.
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-demo
  labels: { app: kubewhy-demo, case: missing-secret }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kubewhy-secret-that-does-not-exist
              key: password
      resources:
        requests: { cpu: 10m, memory: 16Mi }
