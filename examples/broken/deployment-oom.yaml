# A Deployment whose replicas all die the same way.
# Expected: POD_OOM_KILLED reported once as "3 of 3 Pods", with
# DEPLOYMENT_UNAVAILABLE_REPLICAS as its consequence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-demo
  labels: { app: kubewhy-demo, case: deployment-oom }
spec:
  replicas: 3
  selector:
    matchLabels: { app: checkout-demo }
  template:
    metadata:
      labels: { app: checkout-demo }
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command:
            - sh
            - -c
            - "dd if=/dev/zero of=/dev/shm/fill bs=1M count=256; sleep 3600"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - name: memory
              mountPath: /dev/shm
      volumes:
        - name: memory
          emptyDir:
            medium: Memory
