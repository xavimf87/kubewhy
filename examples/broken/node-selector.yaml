# Selects a node label that no node carries.
# Expected: POD_UNSCHEDULABLE_NODE_AFFINITY.
apiVersion: v1
kind: Pod
metadata:
  name: node-selector-demo
  labels: { app: kubewhy-demo, case: node-selector }
spec:
  nodeSelector:
    kubewhy.example.com/hardware: quantum
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
