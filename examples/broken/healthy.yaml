# The control case: a Pod that works. KubeWhy must find nothing to report.
apiVersion: v1
kind: Pod
metadata:
  name: healthy-demo
  labels: { app: kubewhy-demo, case: healthy }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
